plugins { id 'com.android.application' }
android {
    namespace 'tools.rea.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'tools.rea.mobile'
        minSdk 27
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
